services:
  db:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_USER: invest
      POSTGRES_DB: invest
      # Local-only development credential, never deploy this database publicly.
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - invest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invest -d invest']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  invest-pgdata:
    name: invest-pgdata
