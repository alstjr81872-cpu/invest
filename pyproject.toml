[project]
name = "shortlist-invest"
version = "0.1.0"
description = "Private, evidence-first swing trading research and paper portfolio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3", "starlette==1.8.0", "uvicorn==0.34.3", "websockets==15.0.1", "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9", "pandas==2.2.3", "numpy==2.2.6",
  "exchange-calendars==4.11.1", "httpx==0.28.1", "argon2-cffi==25.1.0",
  "python-dotenv==1.2.4", "plotly==6.1.2", "alembic==1.16.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.13"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
invest = ["strategies.toml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
